<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#064b32"><title>HIPPIQUE SYSTÈME PRO</title>
<link rel="manifest" href="./manifest.webmanifest?v=20261106-2"><link rel="icon" type="image/png" sizes="192x192" href="/Amigo-syst-me-pro/hippique/hippique-logo-192.png?v=20261106-2"><link rel="apple-touch-icon" href="/Amigo-syst-me-pro/hippique/hippique-logo-192.png?v=20261106-2">
<style>html,body{margin:0;width:100%;height:100%;background:#eaf0f3;font:14px system-ui}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:8px;padding:5px 10px;background:#064b32;color:#fff;flex:none}header img{width:32px;height:32px}header strong{font-size:13px}header button{margin-left:auto;background:#f4ce68;color:#123929;border:0;border-radius:6px;padding:7px;font-weight:700}iframe{width:100%;flex:1;border:0;min-height:0}#fallback{padding:8px;text-align:center}a{color:#15532f}</style></head>
<body><header><img src="/Amigo-syst-me-pro/hippique/hippique-logo-192.png?v=20261106-2" alt=""><strong>HIPPIQUE SYSTÈME PRO</strong><button id="install" hidden>Installer HIPPIQUE</button></header>
<iframe src="/Amigo-syst-me-pro/hippique/index.html" title="Logiciel HIPPIQUE SYSTÈME PRO" allow="clipboard-write; web-share" allowfullscreen></iframe>
<div id="fallback" hidden>Si le logiciel ne s’affiche pas : <a href="/Amigo-syst-me-pro/hippique/index.html" target="_blank" rel="noopener">ouvrir HIPPIQUE directement</a>.</div>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
let pending;const button=document.getElementById('install');
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();pending=event;button.hidden=false});
button.addEventListener('click',async()=>{if(!pending)return;await pending.prompt();await pending.userChoice;pending=null;button.hidden=true});
window.addEventListener('appinstalled',()=>{button.hidden=true;pending=null});
setTimeout(()=>{document.getElementById('fallback').hidden=false},12000);
</script></body></html>
